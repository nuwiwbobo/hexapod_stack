# =============================================================================
# Reignblaze Hexapod Configuration
# =============================================================================
# Servo configuration for 18 Dynamixel AX servos (6 legs × 3 servos)
# Source: ROS 1 stack (hexapod_controller/config/reignblaze.yaml)
#
# Servo mapping:
#   Left side (LR, LM, LF): coxa sign=+1, femur sign=+1, tibia sign=-1
#   Right side (RR, RM, RF): coxa sign=-1, femur sign=-1, tibia sign=+1
#
# AX-18A specs:
#   - Ticks: 1024 (0-1023 range)
#   - Center: 512
#   - Max range: 300° (5.236 rad)

hexapod_servo:
  port: "/dev/ttyUSB0"
  baud_rate: 1000000
  protocol_version: 1.0
  servos:
    # Right Rear leg
    coxa_joint_RR:  { id: 10, type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    femur_joint_RR: { id: 11, type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    tibia_joint_RR: { id: 12, type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: 1, offset: 0.00614 }

    # Right Middle leg
    coxa_joint_RM:  { id: 16, type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    femur_joint_RM: { id: 17, type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    tibia_joint_RM: { id: 18, type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: 1, offset: 0.00614 }

    # Right Front leg
    coxa_joint_RF:  { id: 7,  type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    femur_joint_RF: { id: 8,  type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    tibia_joint_RF: { id: 9,  type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: 1, offset: 0.00614 }

    # Left Rear leg
    coxa_joint_LR:  { id: 1,  type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    femur_joint_LR: { id: 2,  type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    tibia_joint_LR: { id: 3,  type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: 1, offset: 0.00614 }

    # Left Middle leg
    coxa_joint_LM:  { id: 13, type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    femur_joint_LM: { id: 14, type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    tibia_joint_LM: { id: 15, type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: 1, offset: 0.00614 }

    # Left Front leg
    coxa_joint_LF:  { id: 4,  type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    femur_joint_LF: { id: 5,  type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: -1, offset: 0.00614 }
    tibia_joint_LF: { id: 6,  type: "AX-18A", ticks: 1024, center: 512, max_radians: 5.236, sign: 1, offset: 0.00614 }

hexapod_ik:
  coxa_length: 0.044      # meters
  femur_length: 0.0545    # meters
  tibia_length: 0.1019    # meters

hexapod_gait:
  cycle_length: 48        # steps per full cycle
  lift_height: 0.03       # meters
  step_time: 0.05         # seconds per step

hexapod_control:
  control_loop_rate: 500  # Hz
  joint_names:
    LF: ["coxa_joint_LF", "femur_joint_LF", "tibia_joint_LF"]
    RF: ["coxa_joint_RF", "femur_joint_RF", "tibia_joint_RF"]
    LM: ["coxa_joint_LM", "femur_joint_LM", "tibia_joint_LM"]
    RM: ["coxa_joint_RM", "femur_joint_RM", "tibia_joint_RM"]
    LR: ["coxa_joint_LR", "femur_joint_LR", "tibia_joint_LR"]
    RR: ["coxa_joint_RR", "femur_joint_RR", "tibia_joint_RR"]
