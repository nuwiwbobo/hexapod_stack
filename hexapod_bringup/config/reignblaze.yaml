# =============================================================================
# Task 8: Reignblaze Hexapod Configuration
# =============================================================================
# Servo configuration for 18 Dynamixel AX servos (6 legs × 3 servos)
#
# Servo mapping (from ROS 1 stack):
#   Coxa servos: AX-12A (IDs 7-13, even/odd varies)
#   Femur/Tibia servos: AX-18A (IDs 1-6, 11-18)
#
# Sign convention:
#   +1 = normal mounting
#   -1 = reversed mounting (flips direction)
#
# Offset:
#   Hardware offset in radians (usually 0.0, adjust per servo)

hexapod_servo:
  port: "/dev/ttyUSB0"
  baud_rate: 1000000
  protocol_version: 1.0
  servos:
    # Left Front leg
    coxa_joint_LF:  { id: 7,  type: "AX-12A", ticks: 1024, center: 512, offset: 0.0, sign: 1 }
    femur_joint_LF: { id: 1,  type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: -1 }
    tibia_joint_LF: { id: 2,  type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: 1 }

    # Right Front leg
    coxa_joint_RF:  { id: 8,  type: "AX-12A", ticks: 1024, center: 512, offset: 0.0, sign: -1 }
    femur_joint_RF: { id: 3,  type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: 1 }
    tibia_joint_RF: { id: 4,  type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: -1 }

    # Left Middle leg
    coxa_joint_LM:  { id: 9,  type: "AX-12A", ticks: 1024, center: 512, offset: 0.0, sign: 1 }
    femur_joint_LM: { id: 5,  type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: -1 }
    tibia_joint_LM: { id: 6,  type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: 1 }

    # Right Middle leg
    coxa_joint_RM:  { id: 10, type: "AX-12A", ticks: 1024, center: 512, offset: 0.0, sign: -1 }
    femur_joint_RM: { id: 11, type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: 1 }
    tibia_joint_RM: { id: 12, type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: -1 }

    # Left Rear leg
    coxa_joint_LR:  { id: 13, type: "AX-12A", ticks: 1024, center: 512, offset: 0.0, sign: 1 }
    femur_joint_LR: { id: 14, type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: -1 }
    tibia_joint_LR: { id: 15, type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: 1 }

    # Right Rear leg
    coxa_joint_RR:  { id: 16, type: "AX-12A", ticks: 1024, center: 512, offset: 0.0, sign: -1 }
    femur_joint_RR: { id: 17, type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: 1 }
    tibia_joint_RR: { id: 18, type: "AX-18A", ticks: 1024, center: 512, offset: 0.0, sign: -1 }

hexapod_ik:
  coxa_length: 0.044      # meters
  femur_length: 0.0545    # meters
  tibia_length: 0.1019    # meters

hexapod_gait:
  cycle_length: 48        # steps per full cycle
  lift_height: 0.03       # meters
  step_time: 0.05         # seconds per step

hexapod_control:
  control_loop_rate: 500  # Hz
